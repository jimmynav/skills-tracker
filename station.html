<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skills Station</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sheets.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Instructor station: one column, phone-first. Header (station, skill, timer) stays pinned; the sheet scrolls under it. */
:root{
  --ink:#16202c; --muted:#5b6878; --line:#d7dee7; --paper:#f4f6f9; --card:#ffffff;
  --accent:#1d5fbf; --accent-soft:#e3edfb; --pass:#1e7a46; --pass-soft:#e2f3e8; --fail:#b42318; --fail-soft:#fbe6e4; --warn:#a15c00; --warn-soft:#fdf0d9;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root{ --ink:#e6ebf1; --muted:#97a3b3; --line:#2c3746; --paper:#10161e; --card:#18212c; --accent:#6ea2f0; --accent-soft:#1c2c45; --pass:#5cc58a; --pass-soft:#163324; --fail:#f07a6e; --fail-soft:#3a1c1a; --warn:#e8a94a; --warn-soft:#38291a; color-scheme: dark; } }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 120px;display:grid;gap:12px}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px calc(10px);padding-top:max(10px, env(safe-area-inset-top))}
.top .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:32px;padding:0 8px;border-radius:7px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;font-size:17px}
.top .who{font-weight:700}
.top .sk{color:var(--muted);font-size:14px}
.pausebtn{border:1.5px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 12px;font-weight:700;min-height:36px}
.pausebtn.on{background:var(--warn);color:#fff}
.top .in{flex-direction:column;align-items:stretch;gap:6px}
.trow1{display:flex;gap:10px;align-items:center}
.trow2{display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:6px}
.cand{flex:1;min-width:0;display:flex;gap:6px;align-items:center;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.2}
.cand .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cand .chip{font-family:var(--body);font-weight:600;font-size:11px;flex:none;padding:1px 6px}
@media (max-width:360px){ .cand{font-size:14px} }
.trow2 .timer{margin-left:0;font-size:18px}
.pausedbar{border:1.5px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:700}
.irow{display:flex;gap:6px;align-items:stretch}
.irow .item{flex:1}
.nbtn{flex:none;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:0 10px;font-size:13px;font-weight:600;min-width:62px}
.nbtn:disabled{display:none}
.inote{display:block;width:100%;text-align:left;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;margin-top:-2px}
.inote b{color:var(--warn)}
.timer{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:20px;padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.timer.paused{background:var(--warn);color:#fff}
.timer.near{background:var(--warn-soft);color:var(--warn)} .timer.over{background:var(--fail);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.big{font-family:var(--display);font-size:24px;font-weight:800}
.muted{color:var(--muted);font-size:14px}
.chip{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.chip.re{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
input.txt,textarea.txt{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
textarea.txt{min-height:90px;resize:vertical}
.code-in{font-family:var(--mono);font-size:28px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.note{font-style:italic;font-size:14px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.item{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--card);text-align:left;width:100%;min-height:52px}
.item .box{flex:none;width:28px;height:28px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.item.on{border-color:var(--pass);background:var(--pass-soft)}
.item.on .box{background:var(--pass);border-color:var(--pass)}
.item .pt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.group{border:1.5px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--card)}
.group .gt{display:flex;gap:8px;align-items:baseline;font-weight:600}
.group .gt .pt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.subs{display:flex;flex-wrap:wrap;gap:8px}
.sub{border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--paper);min-height:44px;text-align:left}
.sub.on{border-color:var(--pass);background:var(--pass);color:#fff;font-weight:600}
.crit{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:left;width:100%}
.crit .box{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.crit.on{border-color:var(--fail);background:var(--fail-soft)} .crit.on .box{background:var(--fail);border-color:var(--fail)}
.prompt{white-space:pre-wrap;font-size:17px;line-height:1.55;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px}
.btn.start{background:var(--pass);border-color:var(--pass);color:#fff;font-size:20px;min-height:60px}
.btn.endbtn{background:var(--fail);border-color:var(--fail);color:#fff}
.clockbig{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--accent)}
.clockbig.stopped{color:var(--ink)}
details summary{cursor:pointer;margin-bottom:6px}
.viewbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:8px 12px;font-weight:700;margin-top:-4px;text-align:left}
.vscroll{max-height:62vh;overflow:auto;display:grid;gap:8px;padding-right:2px}
.vrow{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px}
.vrow.miss{border-color:var(--fail);background:var(--fail-soft)}
.vmk{font-weight:800;width:18px} .vrow.miss .vmk{color:var(--fail)}
.vpt{font-family:var(--mono);font-weight:600;white-space:nowrap}
.vsubs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:4px 0 0 26px}
.vsubs .n{color:var(--fail);font-weight:600} .vsubs .y{color:var(--muted)}
.vnote{margin:6px 0 0 26px;font-size:13.5px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:4px 8px}
.vnote b{color:var(--warn)}
.vgen{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;white-space:pre-wrap}
.modal{max-height:92vh;overflow:auto}
.givecard summary{cursor:pointer;list-style:none}
.give{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.give.done{opacity:.55}
.gname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gres{font-family:var(--mono);font-weight:800;font-size:14px;padding:3px 8px;border-radius:6px}
.gres.p{background:var(--pass-soft);color:var(--pass)} .gres.f{background:var(--fail-soft);color:var(--fail)}
.toldbtn{border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-weight:700;min-height:44px;background:var(--card)}
.toldbtn.on{background:var(--pass);border-color:var(--pass);color:#fff}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtn{border:2px solid var(--line);border-radius:12px;padding:16px;font-family:var(--display);font-size:22px;font-weight:800;background:var(--card)}
.rbtn.p.on{background:var(--pass);border-color:var(--pass);color:#fff} .rbtn.f.on{background:var(--fail);border-color:var(--fail);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.score{font-family:var(--display);font-size:22px;font-weight:800}
.warn{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:600}
.bad{border:1px solid var(--fail);background:var(--fail-soft);color:var(--fail);border-radius:10px;padding:10px 12px;font-weight:600}
.ok{border:1px solid var(--pass);background:var(--pass-soft);color:var(--pass);border-radius:10px;padding:10px 12px;font-weight:600}
.center{text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal-bg[hidden]{display:none}
.modal{background:var(--card);border-radius:16px 16px 0 0;max-width:760px;width:100%;padding:18px;display:grid;gap:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
[hidden]{display:none !important}
@media (prefers-reduced-motion: no-preference){ .item,.sub,.crit{transition:background .12s,border-color .12s} }
</style>
</head>
<body>
<div class="top" id="top" hidden><div class="in">
  <div class="trow1"><span class="stn" id="tStn">–</span>
  <div><div class="who" id="tWho"></div><div class="sk" id="tSkill"></div></div></div>
  <div class="trow2" id="tRow2" hidden>
    <div class="cand" id="tCand"></div>
    <span class="timer" id="tTimer" hidden>0:00</span>
    <button class="pausebtn" id="tPause" hidden>Pause</button>
  </div>
</div></div>
<main class="wrap" id="app"><div class="card center"><div class="muted">Loading…</div></div></main>
<div class="bar" id="bar" hidden><div class="in">
  <div><div class="muted" style="font-size:12px">Points</div><div class="score" id="bScore">0 / 0</div></div>
  <button class="btn primary" id="bSubmit" style="margin-left:auto;min-width:150px">Submit sheet</button>
</div></div>
<div class="modal-bg" id="mBg" hidden><div class="modal" id="m"></div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
/* Test time with paused stretches removed (equipment problems shouldn't count against the candidate). */
function pausedMs(f, toMs){ if(!f) return 0; let ms = 0; for(const p of (f.pauses||[])) ms += Date.parse(p.e) - Date.parse(p.s); if(f.pausedAt) ms += (toMs==null? Date.now() : toMs) - Date.parse(f.pausedAt); return Math.max(0, ms); }
function activeTestMs(f){ if(!f || !f.tStart) return 0; const end = f.tEnd ? Date.parse(f.tEnd) : Date.now(); return Math.max(0, end - Date.parse(f.tStart) - pausedMs(f, end)); }
function durText(ms){ const t=Math.max(0,Math.floor(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h? h+":"+String(m).padStart(2,"0") : m)+":"+String(s).padStart(2,"0"); }

let db = null, uid = null;
let code = null, stationDoc = null, unsubStation = null, unsubSub = null;
let form = null;        // working sheet for the current send
let sub = null;         // my submission for the current send, as stored

/* ---------- boot ---------- */
async function boot(){
  if(window.__testDb){ db = window.__testDb; uid = "test-instructor"; return start(); }
  if(!window.firebase || !window.FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey){ showMsg("This station page isn't connected yet. Ask the lead instructor."); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  try{
    const cred = await firebase.auth().signInAnonymously();
    uid = cred.user.uid; db = firebase.firestore(); start();
  }catch(e){ showMsg("Couldn't connect. Check the Wi-Fi and reload the page."); }
}
function start(){
  const fromHash = (location.hash||"").replace("#","").trim().toUpperCase();
  if(fromHash){ store("station-code", fromHash); history.replaceState(null, "", location.pathname); }
  code = fromHash || store("station-code");
  if(code) listen(code); else askCode();
}
function showMsg(t){ $("app").innerHTML = `<div class="card center"><div>${esc(t)}</div></div>`; }
function askCode(msg){
  $("top").hidden = true; $("bar").hidden = true;
  $("app").innerHTML = `<div class="card">
    <h1>Skills station</h1>
    <p class="muted" style="margin:0">Enter the station code from the lead instructor.</p>
    ${msg? `<div class="bad">${esc(msg)}</div>`:""}
    <input class="txt code-in" id="codeIn" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Station code">
    <button class="btn primary" id="codeGo">Open my station</button></div>`;
  const go = ()=>{ const c = $("codeIn").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""); if(c.length<4) return; store("station-code", c); code = c; listen(c); };
  $("codeGo").onclick = go; $("codeIn").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); }); $("codeIn").focus();
}
function listen(c){
  if(unsubStation) unsubStation();
  showMsg("Opening your station…");
  unsubStation = db.doc("stationCodes/"+c).onSnapshot(snap=>{
    if(!snap.exists){ store("station-code", null); askCode("That code isn't active. Check it with the lead instructor."); return; }
    const prev = stationDoc; stationDoc = snap.data();
    const tm = toldMap(); let ch = false; for(const g of (stationDoc.toGive||[])){ if(tm[g.aid]!==undefined && !!tm[g.aid]===g.told){ delete tm[g.aid]; ch = true; } } if(ch) store("told:"+code, tm);
    const prevSend = prev && prev.student ? prev.student.sendId : null, nowSend = stationDoc.student ? stationDoc.student.sendId : null;
    if(prevSend !== nowSend){ loadFormFor(stationDoc); if(stationDoc.student && form && !form.tStart && !store("sub:"+stationDoc.student.sendId)) pushStatus("called"); }
    render();
  }, err=>{ store("station-code", null); askCode("That code isn't active. Check it with the lead instructor."); });
}

/* ---------- the working sheet for the current student ---------- */
function draftKey(){ return stationDoc && stationDoc.student ? "draft:"+code+":"+stationDoc.student.sendId : null; }
function loadFormFor(d){
  if(unsubSub){ unsubSub(); unsubSub = null; }
  sub = null;
  if(!d.student){ form = null; return; }
  form = store(draftKey()) || {marks:{}, critical:[], criticalNotes:"", notes:"", scenario:"", result:null};
  const subId = store("sub:"+d.student.sendId);
  if(subId){
    unsubSub = db.collection("submissions").doc(subId).onSnapshot(s=>{
      sub = s.exists ? Object.assign({id:s.id}, s.data()) : null;
      if(sub && sub.status==="returned" && form._submitted){ form._submitted = false; saveDraft(); }
      render();
    }, ()=>{});
  }
}
function saveDraft(){ const k = draftKey(); if(k) store(k, form); }
/* Tell the lead instructor's tracker where this test is: called → running → ended → submitted. */
function pushStatus(phase){
  const d = stationDoc; if(!d || !d.student) return;
  db.doc("stationStatus/"+code).set({code, cls: d.cls, iid: d.iid, sendId: d.student.sendId, phase,
    startedAt: form.tStart || null, endedAt: form.tEnd || null, pausedAt: form.pausedAt || null, pausedMs: pausedMs(Object.assign({}, form, {pausedAt:null})), at: new Date().toISOString()}).catch(()=>{});
}
function sheet(){ return stationDoc && stationDoc.skillId ? SKILL_SHEETS[stationDoc.skillId] : null; }

/* ---------- rendering ---------- */
function render(){
  const d = stationDoc; if(!d) return;
  $("top").hidden = false;
  $("tStn").textContent = d.stationNo || "–";
  $("tWho").textContent = d.instructorName + " · " + d.lab;
  const sh = sheet();
  $("tSkill").textContent = sh ? `${sh.code} · ${sh.title}` : (d.skillName || "No skill assigned yet");
  const stu = d.student;
  $("tTimer").hidden = !(stu && form && form.tStart);
  const running = !!(stu && form && form.tStart && !form.tEnd && !(sub && sub.status==="pending"));
  const pb = $("tPause"); pb.hidden = !running; pb.textContent = form && form.pausedAt ? "Resume" : "Pause"; pb.classList.toggle("on", !!(form && form.pausedAt));
  const tc = $("tCand"); $("tRow2").hidden = !stu;
  if(stu) tc.innerHTML = `<span class="nm" title="${esc(stu.name)}">${esc(stu.name)}</span>${stu.attemptNo>1?`<span class="chip re">R${stu.attemptNo}</span>`:""}${stu.assistantName?`<span class="chip" title="Assistant">Asst: ${esc(stu.assistantName.split(",")[0])}</span>`:""}`;
  if(d.onBreak && !stu){ $("bar").hidden = true; $("app").innerHTML = `<div class="card center"><div class="big">You're marked “not here”</div><div class="muted">The lead instructor will send students when you're back.</div></div>${giveHtml(true)}${switchLink()}`; return; }
  if(!stu){
    $("bar").hidden = true;
    $("app").innerHTML = `<div class="card center"><div class="big">Waiting for your next student</div>
      <div class="muted">${sh? "You're testing <b>"+esc(sh.title)+"</b>. ":""}This screen updates by itself when a student is sent to you.</div></div>${giveHtml(true)}${switchLink()}`;
    return;
  }
  if(!sh){ $("bar").hidden = true; $("app").innerHTML = `<div class="card"><div class="big">${esc(stu.name)}</div><div class="warn">There's no digital sheet for “${esc(d.skillName||"this skill")}”. Grade on paper and tell the lead instructor the result.</div></div>`; return; }

  const submittedPending = sub && sub.status==="pending";
  const returned = sub && sub.status==="returned";
  const locked = submittedPending;
  const promptHtml = d.prompt ? `<div class="prompt">${esc(d.prompt)}</div>` : `<div class="muted">No candidate prompt has been added for this skill yet. The lead instructor can add one in Setup.</div>`;
  if(!form.tStart && !sub){
    $("bar").hidden = true;
    $("app").innerHTML = `<div class="card">
        <div class="muted">Your next candidate</div>
        <div class="big">${esc(stu.name)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${stu.attemptNo>1?`<span class="chip re">Retest · attempt ${stu.attemptNo} of 3</span>`:`<span class="chip">1st attempt</span>`}${stu.assistantName?`<span class="chip">Assistant: ${esc(stu.assistantName)}</span>`:""}</div>
        <div class="muted">Call the candidate to the testing area.</div></div>
      <div class="card"><h3>Read to the candidate</h3>${promptHtml}
        ${sh.timeLimitMin?`<div class="muted">Time limit: ${sh.timeLimitMin} minutes from Start.</div>`:""}
        <button class="btn start" id="startTest">Start test</button>
        <div class="muted center">Tap Start when the candidate is ready. The clock starts now.</div></div>${giveHtml(false)}`;
    $("startTest").onclick = ()=>{ form.tStart = new Date().toISOString(); form.tEnd = null; saveDraft(); pushStatus("running"); render(); };
    return;
  }
  const ended = !!form.tEnd;
  const clockCard = `<div class="card clockcard">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div><div class="muted">${ended?"Test ended":"Test in progress"}</div><div class="clockbig ${ended||form.pausedAt?"stopped":""}" id="clockBig">${durText(activeTestMs(form))}</div></div>
        ${locked? "" : ended ? `<button class="btn" id="undoEnd" style="margin-left:auto">Undo end</button>` : `<button class="btn endbtn" id="endTest" style="margin-left:auto">End test</button>`}
      </div>
      ${form.pausedAt? `<div class="pausedbar">Clock paused${form.pauseReason?`: ${esc(form.pauseReason)}`:""}. Tap Resume at the top when you're ready.</div>`:""}
      ${(form.pauses||[]).length? `<div class="muted">Paused ${form.pauses.length}× · ${durText(pausedMs(Object.assign({}, form, {pausedAt:null})))} not counted</div>`:""}
      <details${ended?"":" open"}><summary class="muted">Candidate prompt</summary>${promptHtml}</details></div>`;
  const head = clockCard + `<div class="card">
      <div class="row" style="display:flex;gap:6px;flex-wrap:wrap">${stu.attemptNo>1?`<span class="chip re">Retest · attempt ${stu.attemptNo} of 3</span>`:`<span class="chip">1st attempt</span>`}${stu.assistantName?`<span class="chip">Assistant: ${esc(stu.assistantName)}</span>`:""}${sh.timeLimitMin?`<span class="chip">Time limit ${sh.timeLimitMin} min</span>`:""}</div>
      ${sh.scenario? `<label class="muted" for="scen">Scenario #</label><input class="txt" id="scen" value="${esc(form.scenario)}" ${locked?"disabled":""} inputmode="numeric" style="max-width:160px">`:""}
    </div>`;
  const status = submittedPending ? `<div class="ok">Submitted. Waiting for the lead instructor to approve. You can't change it unless they send it back.</div>`
    : returned ? `<div class="bad">Sent back by the lead instructor: “${esc(sub.returnNote||"")}”. Make your changes and submit again.</div>` : "";
  const rows = sh.rows.map((r,i)=>{
    if(r.h) return `<div class="sec">${esc(r.h)}</div>`;
    if(r.note) return `<div class="note">${esc(r.note)}</div>`;
    const n = (form.itemNotes||{})[i];
    const noteChip = n ? `<button class="inote" data-note="${i}" ${locked?"disabled":""}><b>Note:</b> ${esc(n)}</button>` : "";
    const noteBtn = n ? "" : `<button class="nbtn" data-note="${i}" ${locked?"disabled":""} aria-label="Add a note to this step">+ Note</button>`;
    if(r.p){ const on = !!form.marks["r"+i]; return `<div><div class="irow"><button class="item ${on?"on":""}" data-k="r${i}" ${locked?"disabled":""}><span class="box">${on?"✓":""}</span><span>${esc(r.t)}</span><span class="pt">${on?r.p:0}/${r.p}</span></button>${noteBtn}</div>${noteChip}</div>`; }
    const got = SheetKit.rowScore(r,i,form.marks), max = SheetKit.rowMax(r);
    const opts = r.subs ? r.subs.map((t,j)=>({k:"r"+i+"."+j, t})) : r.opts.map(o=>({k:"r"+i+"."+o, t:o}));
    return `<div class="group"><div class="gt"><span>${esc(r.t)}${r.choose?` <span class="muted">(up to ${r.choose})</span>`:""}</span><span class="pt">${got}/${max}</span>${noteBtn.replace('class="nbtn"','class="nbtn" style="min-height:32px"')}</div>
      <div class="subs">${opts.map(o=>`<button class="sub ${form.marks[o.k]?"on":""}" data-k="${esc(o.k)}" ${locked?"disabled":""}>${esc(o.t)}</button>`).join("")}</div>${noteChip}</div>`;
  }).join("");
  const crit = sh.critical.map((c,i)=>{ const on = form.critical.includes(i); return `<button class="crit ${on?"on":""}" data-c="${i}" ${locked?"disabled":""}><span class="box">${on?"✕":""}</span><span>${esc(c)}</span></button>`; }).join("");
  const critOn = form.critical.length>0;
  $("app").innerHTML = head + status + `<div class="card" style="gap:8px">${rows}</div>
    <div class="card" style="gap:8px"><h3>Critical criteria</h3>${crit}
      ${critOn? `<label class="muted" for="critNotes"><b style="color:var(--fail)">Required:</b> document your rationale for each checked item</label><textarea class="txt" id="critNotes" ${locked?"disabled":""}>${esc(form.criticalNotes)}</textarea>`:""}</div>
    <div class="card"><h3>Notes</h3><textarea class="txt" id="notes" placeholder="Anything you want on the record" ${locked?"disabled":""}>${esc(form.notes)}</textarea></div>
    ${giveHtml(false)}
    <div class="card"><h3>Your decision</h3>
      <div class="result"><button class="rbtn p ${form.result==="P"?"on":""}" data-r="P" ${locked?"disabled":""}>PASS</button><button class="rbtn f ${form.result==="F"?"on":""}" data-r="F" ${locked?"disabled":""}>FAIL</button></div>
      ${critOn && form.result==="P" ? `<div class="warn">A critical criterion is checked. NREMT standard is a fail when any critical criterion is checked.</div>`:""}
    </div>`;
  $("bar").hidden = false;
  $("bScore").textContent = SheetKit.sheetScore(sh, form.marks) + " / " + SheetKit.sheetTotal(sh);
  const eb = $("endTest"); if(eb) eb.onclick = ()=>{ closePause(); form.tEnd = new Date().toISOString(); saveDraft(); pushStatus("ended"); render(); };
  const ub = $("undoEnd"); if(ub) ub.onclick = ()=>{ form.tEnd = null; saveDraft(); pushStatus("running"); render(); };
  $("bSubmit").disabled = locked;
  $("bSubmit").textContent = locked ? "Submitted" : returned ? "Resubmit sheet" : "Submit sheet";
  tick();
}
function switchLink(){ return `<p class="center"><button class="btn" id="switchCode" style="min-height:40px;padding:8px 14px">Use a different code</button></p>`; }

/* ---------- input ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t || t.disabled) return;
  if(t.dataset.told){ setTold(t.dataset.told); return; }
  if(t.dataset.view){ viewSheet(t.dataset.view); return; }
  if(t.id==="switchCode"){ store("station-code", null); if(unsubStation) unsubStation(); stationDoc = null; askCode(); return; }
  if(!form) return;
  const sh = sheet();
  if(t.id==="tPause"){ if(form.pausedAt){ closePause(); saveDraft(); pushStatus("running"); render(); } else askPause(); return; }
  if(t.dataset.note!=null){ editNote(Number(t.dataset.note)); return; }
  if(t.dataset.k){
    const k = t.dataset.k;
    const ri = Number(k.slice(1).split(".")[0]), r = sh.rows[ri];
    if(form.marks[k]) delete form.marks[k];
    else {
      if(r && r.choose){ const n = r.opts.filter(o=>form.marks["r"+ri+"."+o]).length; if(n>=r.choose){ flash(`Up to ${r.choose} body systems count for points.`); return; } }
      form.marks[k] = true;
    }
    saveDraft(); render(); return;
  }
  if(t.dataset.c!=null){ const i = Number(t.dataset.c); form.critical = form.critical.includes(i) ? form.critical.filter(x=>x!==i) : form.critical.concat([i]).sort((a,b)=>a-b); saveDraft(); render(); return; }
  if(t.dataset.r){ form.result = form.result===t.dataset.r ? null : t.dataset.r; saveDraft(); render(); return; }
});
document.addEventListener("input", e=>{
  if(!form) return;
  if(e.target.id==="notes") form.notes = e.target.value;
  if(e.target.id==="critNotes") form.criticalNotes = e.target.value;
  if(e.target.id==="scen") form.scenario = e.target.value;
  saveDraft();
});
$("bSubmit").onclick = ()=>{
  const sh = sheet(); if(!form || !sh) return;
  if(!form.result){ flash("Choose PASS or FAIL first."); return; }
  if(form.critical.length && !form.criticalNotes.trim()){ flash("Document your rationale for the checked critical criteria."); const c=$("critNotes"); if(c) c.focus(); return; }
  const pts = SheetKit.sheetScore(sh, form.marks), tot = SheetKit.sheetTotal(sh);
  if(!form.tEnd){ closePause(); form.tEnd = new Date().toISOString(); saveDraft(); pushStatus("ended"); render(); }
  openSheet(`<h2>Submit this sheet?</h2>
    <div class="muted">Test time ${durText(activeTestMs(form))}${(form.pauses||[]).length?` (clock paused ${durText(pausedMs(form))}, not counted)`:""}</div>
    <div><b>${esc(stationDoc.student.name)}</b> · ${esc(sh.title)}</div>
    <div class="big">${form.result==="P"?"PASS":"FAIL"} · ${pts}/${tot}</div>
    ${form.critical.length? `<div class="bad">${form.critical.length} critical criteri${form.critical.length>1?"a":"on"} checked</div>`:""}
    <div class="muted">It goes to the lead instructor for approval.</div>
    <div style="display:flex;gap:10px"><button class="btn" id="mCancel" style="flex:1">Keep editing</button><button class="btn primary" id="mGo" style="flex:1">Submit</button></div>`);
  $("mCancel").onclick = closeSheet;
  $("mGo").onclick = submit;
};
async function submit(){
  const sh = sheet(), d = stationDoc, stu = d.student;
  $("mGo").disabled = true;
  const body = {code, uid, cls: d.cls, iid: d.iid, examiner: d.instructorName, studentId: stu.id, studentName: stu.name, skillId: d.skillId,
    sendId: stu.sendId, attemptNo: stu.attemptNo, assistantName: stu.assistantName || null,
    marks: form.marks, critical: form.critical, criticalNotes: form.criticalNotes || "", notes: form.notes || "", scenario: form.scenario || "",
    points: SheetKit.sheetScore(sh, form.marks), result: form.result, startedAt: form.tStart || stu.startedAt || null, endedAt: form.tEnd || new Date().toISOString(), calledAt: stu.startedAt || null, pauses: form.pauses || [], pausedMs: pausedMs(form), activeMs: activeTestMs(form), itemNotes: form.itemNotes || {},
    submittedAt: new Date().toISOString(), status: "pending"};
  try{
    if(sub && sub.status==="returned"){ await db.collection("submissions").doc(sub.id).set(Object.assign({}, body, {returnNote: sub.returnNote||"", resubmitted: true})); }
    else { const ref = db.collection("submissions").doc(); await ref.set(body); store("sub:"+stu.sendId, ref.id); loadFormFor(d); }
    form._submitted = true; saveDraft(); pushStatus("submitted");
    closeSheet(); render();
  }catch(e){ closeSheet(); flash("Couldn't submit. Check the Wi-Fi and try again. Your sheet is saved on this device."); }
}

/* ---------- results the lead instructor released for this instructor to give ---------- */
function toldMap(){ return store("told:"+code) || {}; }
function giveHtml(openByDefault){
  const list = (stationDoc && stationDoc.toGive) || []; if(!list.length) return "";
  const tm = toldMap();
  const isTold = g => tm[g.aid]!==undefined ? !!tm[g.aid] : g.told;
  const left = list.filter(g=>!isTold(g)).length;
  const rows = list.map(g=>{ const t = isTold(g); return `<div class="give ${t?"done":""}">
      <div style="flex:1;min-width:0"><div class="gname">${esc(g.studentName)}</div><div class="muted">${esc(g.skill)} · attempt ${g.attemptNo}${g.points!=null?` · ${g.points}/${g.total}`:""}</div></div>
      <span class="gres ${g.result==="P"?"p":"f"}">${g.result==="P"?"PASS":"FAIL"}</span>
      <button class="toldbtn ${t?"on":""}" data-told="${g.aid}">${t?"✓ Told":"Told"}</button></div>
      ${g.sheet? `<button class="viewbtn" data-view="${g.aid}">View sheet${missedCount(g)?` · ${missedCount(g)} missed`:""}${(g.sheet.critical||[]).length?` · ${g.sheet.critical.length} critical`:""}</button>` : `<div class="muted" style="font-size:13px;margin-top:-4px">No digital sheet for this one (recorded by the lead instructor).</div>`}`; }).join("");
  return `<details class="card givecard" ${openByDefault||left?"open":""}><summary><h3 style="display:inline">Results to give</h3> <span class="muted">${left? left+" to give" : "all given"}</span></summary>
    <div class="muted">Released by the lead instructor. Tell each candidate their result, then tap Told.</div>${rows}</details>`;
}
function missedCount(g){
  const sh = SKILL_SHEETS[g.skillId]; if(!sh || !g.sheet) return 0;
  return sh.rows.reduce((n,r,i)=> n + ((r.p||r.subs||r.choose) && SheetKit.rowScore(r,i,g.sheet.marks) < SheetKit.rowMax(r) ? 1 : 0), 0);
}
/* Read-only graded sheet, for debriefing the candidate. Missed steps first, then the full sheet. */
function viewSheet(aid){
  const g = ((stationDoc && stationDoc.toGive) || []).find(x=>x.aid===aid); if(!g || !g.sheet) return;
  const sh = SKILL_SHEETS[g.skillId], f = g.sheet, m = f.marks || {};
  const line = (r,i)=>{
    const got = SheetKit.rowScore(r,i,m), max = SheetKit.rowMax(r), note = (f.itemNotes||{})[i];
    let detail = "";
    if(r.subs) detail = `<div class="vsubs">${r.subs.map((t,j)=>`<span class="${m["r"+i+"."+j]?"y":"n"}">${m["r"+i+"."+j]?"✓":"✗"} ${esc(t)}</span>`).join("")}</div>`;
    if(r.choose) detail = `<div class="vsubs">${r.opts.map(o=>`<span class="${m["r"+i+"."+o]?"y":"n"}">${m["r"+i+"."+o]?"✓":"–"} ${esc(o)}</span>`).join("")}</div>`;
    return `<div class="vrow ${got<max?"miss":""}"><div style="display:flex;gap:8px"><span class="vmk">${got===max?"✓":got?"◐":"✗"}</span><span style="flex:1">${esc(r.t)}</span><span class="vpt">${got}/${max}</span></div>${detail}${note?`<div class="vnote"><b>Note:</b> ${esc(note)}</div>`:""}</div>`;
  };
  const scored = sh.rows.map((r,i)=>({r,i})).filter(x=>x.r.p||x.r.subs||x.r.choose);
  const missed = scored.filter(x=>SheetKit.rowScore(x.r,x.i,m) < SheetKit.rowMax(x.r));
  openSheet(`<div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div class="big" style="font-size:20px">${esc(g.studentName)}</div>
      <div class="muted">${esc(sh.code)} · ${esc(sh.title)} · attempt ${g.attemptNo}${f.activeMs!=null?` · ${durText(f.activeMs)}`:""}${f.scenario?` · scenario ${esc(f.scenario)}`:""}</div></div>
      <div style="text-align:right"><div class="gres ${g.result==="P"?"p":"f"}" style="font-size:18px">${g.result==="P"?"PASS":"FAIL"}</div><div class="vpt" style="font-size:16px">${g.points}/${g.total}</div></div></div>
    <div class="vscroll">
      ${(f.critical||[]).length? `<div class="bad" style="font-weight:500"><b>Critical criteria</b><ul style="margin:4px 0 0;padding-left:18px">${f.critical.map(i=>`<li>${esc(sh.critical[i])}</li>`).join("")}</ul>${f.criticalNotes?`<div style="margin-top:4px"><b>Rationale:</b> ${esc(f.criticalNotes)}</div>`:""}</div>`:""}
      ${f.notes? `<div class="vgen"><b>Notes:</b> ${esc(f.notes)}</div>`:""}
      ${(f.pauses||[]).length? `<div class="muted">Clock paused ${f.pauses.length}× (${durText(f.pausedMs||0)} not counted)${f.pauses.filter(p=>p.why).length?": "+f.pauses.filter(p=>p.why).map(p=>esc(p.why)).join("; "):""}</div>`:""}
      <div class="sec">${missed.length? `Missed (${missed.length})` : "No missed steps"}</div>
      ${missed.map(x=>line(x.r,x.i)).join("")}
      ${(()=>{ const noted = scored.filter(x=>(f.itemNotes||{})[x.i] && !missed.includes(x)); return noted.length? `<div class="sec">Step notes</div>${noted.map(x=>line(x.r,x.i)).join("")}` : ""; })()}
      <details><summary class="sec" style="cursor:pointer">Full sheet</summary>${sh.rows.map((r,i)=> r.h? `<div class="sec">${esc(r.h)}</div>` : r.note? "" : line(r,i)).join("")}</details>
    </div>
    <button class="btn" id="vClose">Close</button>`);
  $("vClose").onclick = closeSheet;
}
function setTold(aid){
  const list = (stationDoc && stationDoc.toGive) || [], g = list.find(x=>x.aid===aid); if(!g) return;
  const tm = toldMap(); const cur = tm[aid]!==undefined ? !!tm[aid] : g.told;
  tm[aid] = cur ? false : new Date().toISOString(); store("told:"+code, tm);
  db.doc("stationTold/"+code).set({code, cls: stationDoc.cls, iid: stationDoc.iid, told: tm, at: new Date().toISOString()}).catch(()=>flash("Couldn't save. Check the Wi-Fi."));
  render();
}

/* ---------- pause + step notes ---------- */
function closePause(){ if(form && form.pausedAt){ form.pauses = (form.pauses||[]).concat([{s: form.pausedAt, e: new Date().toISOString(), why: form.pauseReason || ""}]); form.pausedAt = null; form.pauseReason = ""; } }
function askPause(){
  // Stop the clock first; the reason is optional and asked while already paused.
  form.pausedAt = new Date().toISOString(); form.pauseReason = ""; saveDraft(); pushStatus("paused"); render();
  openSheet(`<h2>Clock paused</h2>
    <div class="muted">Paused time isn't counted and is noted on the sheet. Add a reason if you like.</div>
    <input class="txt" id="pWhy" placeholder="Reason (optional), e.g. AED trainer battery died" maxlength="120">
    <div style="display:flex;gap:10px"><button class="btn" id="pNo" style="flex:1">Skip</button><button class="btn primary" id="pGo" style="flex:1">Save reason</button></div>`);
  $("pNo").onclick = closeSheet;
  $("pGo").onclick = ()=>{ if(form.pausedAt){ form.pauseReason = $("pWhy").value.trim(); saveDraft(); render(); } closeSheet(); };
}
function editNote(i){
  const sh = sheet(), r = sh.rows[i]; if(!r) return;
  const cur = (form.itemNotes||{})[i] || "";
  openSheet(`<h2>Note</h2><div class="muted">${esc(r.t)}</div>
    <textarea class="txt" id="nTxt" maxlength="400" placeholder="e.g. Student said goggles but no gloves">${esc(cur)}</textarea>
    <div style="display:flex;gap:10px">${cur?`<button class="btn" id="nDel">Delete</button>`:""}<button class="btn" id="nNo" style="flex:1">Cancel</button><button class="btn primary" id="nGo" style="flex:1">Save note</button></div>`);
  setTimeout(()=>{ const t=$("nTxt"); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } }, 50);
  $("nNo").onclick = closeSheet;
  const save = v => { form.itemNotes = Object.assign({}, form.itemNotes); if(v) form.itemNotes[i] = v; else delete form.itemNotes[i]; saveDraft(); closeSheet(); render(); };
  $("nGo").onclick = ()=>save($("nTxt").value.trim());
  if(cur) $("nDel").onclick = ()=>save("");
}

/* ---------- small UI helpers ---------- */
function openSheet(html){ $("m").innerHTML = html; $("mBg").hidden = false; }
function closeSheet(){ $("mBg").hidden = true; }
$("mBg").addEventListener("click", e=>{ if(e.target===$("mBg")) closeSheet(); });
let flashT = null;
function flash(t){ openSheet(`<div class="warn">${esc(t)}</div><button class="btn" onclick="document.getElementById('mBg').hidden=true">OK</button>`); }
function tick(){
  const d = stationDoc; const el = $("tTimer");
  if(!d || !d.student || !form || !form.tStart){ el.hidden = true; return; }
  el.hidden = false;
  const ms = activeTestMs(form), sh = sheet();
  el.classList.toggle("paused", !!form.pausedAt);
  el.textContent = durText(ms);
  const big = $("clockBig"); if(big) big.textContent = durText(ms);
  el.classList.toggle("near", !!(sh && sh.timeLimitMin && ms >= (sh.timeLimitMin-2)*60000 && ms < sh.timeLimitMin*60000));
  el.classList.toggle("over", !!(sh && sh.timeLimitMin && ms >= sh.timeLimitMin*60000));
}
setInterval(tick, 1000);
boot();

/* ---------- "new version available" check (GitHub Pages caches pages for a few minutes) ---------- */
const BUILD = "20261127063521";
function checkVersion(){
  if(window.__testDb) return;
  fetch("version.json?t=" + Date.now(), {cache: "no-store"}).then(r=>r.ok? r.json() : null).then(v=>{
    if(!v || !v.build || v.build===BUILD || document.getElementById("updBar")) return;
    const b = document.createElement("div"); b.id = "updBar";
    b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:60;background:#1d5fbf;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font:600 14px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)";
    b.innerHTML = 'New version available <button style="border:0;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer">Reload</button>';
    b.querySelector("button").onclick = ()=>location.reload();
    document.body.appendChild(b);
  }).catch(()=>{});
}
setInterval(checkVersion, 120000); setTimeout(checkVersion, 15000);
</script>
